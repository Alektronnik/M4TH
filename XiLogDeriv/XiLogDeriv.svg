<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800.000000 1180.000000" width="1800.000000" height="1180.000000">
  <rect x="0.000000" y="0.000000" width="1800.000000" height="1180.000000" fill="#fbfaf7" stroke="#fbfaf7" stroke-width="0.000000"/>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f5fd1"/>
    </marker>
  </defs>
  <text x="900.000000" y="66.000000" font-size="54" fill="#1f2933" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">XiLogDeriv</text>
  <text x="900.000000" y="100.000000" font-size="24" fill="#475569" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">by Alektronnik</text>
  <text x="900.000000" y="165.000000" font-size="30" fill="#475569" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">logarithmic derivative of Xi: polynomial, GammaR/digamma, and zeta components</text>
  <rect x="115.000000" y="400.000000" width="410.000000" height="210.000000" fill="#eff6ff" stroke="#1f5fd1" stroke-width="1.800000" fill-opacity="0.920000"/>
  <text x="143.000000" y="448.000000" font-size="27" fill="#1f2933" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">polynomial factor</text>
  <text x="143.000000" y="498.000000" font-size="25" fill="#1f5fd1" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">1 / s + 1 / (s - 1)</text>
  <rect x="695.000000" y="400.000000" width="410.000000" height="210.000000" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.800000" fill-opacity="0.920000"/>
  <text x="723.000000" y="448.000000" font-size="27" fill="#1f2933" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">GammaR factor</text>
  <text x="723.000000" y="498.000000" font-size="25" fill="#0f766e" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">-1/2 log pi + 1/2 digamma(s/2)</text>
  <rect x="1275.000000" y="400.000000" width="410.000000" height="210.000000" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.800000" fill-opacity="0.920000"/>
  <text x="1303.000000" y="448.000000" font-size="27" fill="#1f2933" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">zeta factor</text>
  <text x="1303.000000" y="498.000000" font-size="25" fill="#b91c1c" text-anchor="start" font-family="DejaVu Serif, Georgia, serif">zeta'(s) / zeta(s)</text>
  <line x1="525.000000" y1="505.000000" x2="685.000000" y2="505.000000" stroke="#1f5fd1" stroke-width="3.000000" stroke-linecap="round" stroke-dasharray="10 8"/>
  <line x1="1105.000000" y1="505.000000" x2="1265.000000" y2="505.000000" stroke="#1f5fd1" stroke-width="3.000000" stroke-linecap="round" stroke-dasharray="10 8"/>
  <text x="900.000000" y="300.000000" font-size="32" fill="#1f2933" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">entireXiLogDeriv s = Xi'(s) / Xi(s)</text>
  <text x="900.000000" y="705.000000" font-size="26" fill="#1f2933" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">entireXiLogDeriv_full_expansion_with_digamma</text>
  <text x="900.000000" y="760.000000" font-size="23" fill="#475569" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">requires the explicit nonvanishing hypotheses for Xi, GammaR, zeta, and completed zeta</text>
  <text x="900.000000" y="1065.000000" font-size="22" fill="#475569" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif">Illustration of formal objects in XiLogDeriv: entireXiLogDeriv, gammaRFactorLogDeriv_eq_neg_half_log_pi_add_half_digamma, digamma continuity.</text>
</svg>
